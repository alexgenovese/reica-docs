name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The site runs on Dokploy and deploys only from the last job, after the checks pass.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image Dokploy builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TURNSTILE_SITE_KEY=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Dokploy deploy
        env:
          DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        # The webhook expects a GitHub push payload; Dokploy deploys the head of main, which is this commit
        # unless a newer push arrived, and that push cancels this run.
        run: |
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg msg "$COMMIT_MESSAGE" \
            '{ref: "refs/heads/main", after: $sha, head_commit: {id: $sha, message: $msg}, commits: []}')
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$DEPLOY_URL" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -d "$body")
          cat response.txt; echo
          test "$code" = 200
